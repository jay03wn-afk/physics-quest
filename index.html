<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光與聲闖關基地</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Huninn&display=swap" rel="stylesheet">
<style>
/* 設計方向：標本冊的標籤質感 + 方格筆記紙。大地色系，每一關各有一個實驗用色。 */
:root{
  --paper:#F2E6D5; --sand:#D9C4B1; --clay:#B79C8E; --bark:#8F7B69; --moss:#5E5B4C;
  --ink:#3C3A3A; --deep:#2B2A29; --card:#FBF6EC; --ok:#4E7A4F; --bad:#A4473B;
  --acc:#2F7F86;
  --font:'Huninn','Noto Sans TC','PingFang TC','Microsoft JhengHei',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:light}
body{
  margin:0;background-color:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.7;font-size:16px;
  -webkit-text-size-adjust:100%;
}
button,input{font-family:inherit;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 80px}
h1,h2,h3,p{margin:0;text-wrap:balance}
:focus-visible{outline:3px solid var(--deep);outline-offset:2px}

/* ---------- 標籤卡 ---------- */
.label{background:var(--card);border:1.6px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--sand)}
.ptag{display:inline-block;background:var(--acc);color:#fff;font-size:14px;padding:1px 12px;border-radius:0 0 6px 6px;margin:-1px 0 0 14px}

/* ---------- 首頁 ---------- */
.hero{padding:30px 0 6px;position:relative}
.scope{display:inline-block;border:1.6px dashed var(--bark);border-radius:4px;padding:3px 12px;font-size:14px;color:var(--moss);background:var(--card)}
.hero h1{font-size:clamp(40px,8vw,76px);line-height:1.12;letter-spacing:.04em;margin:14px 0 10px;color:var(--deep)}
.hero h1 span{display:block;font-size:.5em;letter-spacing:.2em;color:var(--bark);margin-top:6px}
.hero p.lead{max-width:34em;color:var(--moss);font-size:17px}
.heroWave{display:block;width:100%;height:84px;margin-top:8px}
.prog{display:flex;align-items:center;gap:14px;margin:12px 0 22px;flex-wrap:wrap}
.bar{flex:1;min-width:180px;height:14px;border:1.6px solid var(--ink);border-radius:8px;background:var(--card);overflow:hidden}
.bar i{display:block;height:100%;background:var(--moss);width:0;transition:width .5s}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:20px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:4px 16px;padding:16px 18px 16px 0;position:relative;
  background:var(--card);border:1.6px solid var(--ink);border-radius:6px;box-shadow:4px 4px 0 var(--sand);transition:transform .15s,box-shadow .15s}
.tile:hover:not([aria-disabled=true]){transform:translate(-2px,-2px);box-shadow:6px 6px 0 var(--clay)}
.tile:focus-visible{outline:3px solid var(--deep);outline-offset:3px}
.tile[aria-disabled=true]{cursor:not-allowed;opacity:.55;background:#EFE4D2}
.tile .no{grid-row:1/4;width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--acc);color:#fff;margin:-16px 0 -16px 0;border-radius:4px 0 0 4px;font-size:30px;line-height:1}
.tile .no small{font-size:12px;letter-spacing:.1em}
.tile .no svg{width:30px;height:30px;margin-top:6px}
.tile h2{font-size:22px;line-height:1.3}
.tile .fx{font-size:14px;color:var(--moss)}
.tile .st{font-size:14px;display:flex;gap:10px;align-items:center;color:var(--bark)}
.stars{letter-spacing:2px;color:#B8863B}
.tile.done .no::after{content:"通過";font-size:12px;margin-top:6px;background:#fff;color:var(--acc);border-radius:10px;padding:0 8px}
.certTile{--acc:#8F7B69}

/* ---------- 關卡 ---------- */
.top{display:flex;align-items:center;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
.ghost{background:transparent;border:1.6px solid var(--ink);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:15px;min-height:40px}
.ghost:hover{background:var(--sand)}
.stageTitle{font-size:clamp(26px,4.5vw,40px);line-height:1.25}
.stageTitle em{font-style:normal;color:var(--acc)}
.stageGrid{display:grid;gap:22px;grid-template-columns:minmax(0,1fr);margin-top:10px}
@media(min-width:1000px){.stageGrid{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.panel{padding:14px 18px 20px;min-width:0}
.panel>.ptag{margin-left:0;margin-top:-15px;margin-bottom:10px}
.mission{background:#F3E9D8;border-left:5px solid var(--acc);padding:8px 14px;border-radius:0 6px 6px 0;margin:6px 0 14px;font-size:16px}
.cvwrap{border:1.4px solid var(--bark);border-radius:6px;background:var(--card);overflow:hidden;margin:10px 0}
canvas{display:block;width:100%}
.ctls{display:grid;gap:12px;margin-top:12px}
.ctl{display:grid;grid-template-columns:1fr auto;column-gap:10px;align-items:center}
.ctl label{font-size:15px}
.ctl .sv{font-variant-numeric:tabular-nums;font-size:17px;color:var(--deep);font-weight:700}
.ctl input[type=range]{grid-column:1/-1}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:36px;background:transparent;cursor:pointer;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:var(--sand);border:1.4px solid var(--bark)}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:var(--sand);border:1.4px solid var(--bark)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;margin-top:-12px;border-radius:50%;background:var(--acc);border:2.5px solid var(--deep)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--acc);border:2.5px solid var(--deep)}
.seg{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 8px}
.segbtn{background:transparent;border:1.6px solid var(--ink);border-radius:6px;padding:6px 14px;cursor:pointer;font-size:15px;min-height:40px}
.segbtn[aria-selected=true]{background:var(--ink);color:var(--paper)}
.segbtn:not([aria-selected=true]):hover{background:var(--sand)}
.btn{background:var(--ink);color:var(--paper);border:1.6px solid var(--ink);border-radius:6px;padding:9px 20px;font-size:16px;cursor:pointer;min-height:44px;box-shadow:3px 3px 0 var(--clay)}
.btn:hover{background:var(--deep)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--clay)}
.btn.acc{background:var(--acc);border-color:var(--deep)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.readout{background:#F3E9D8;border:1.4px dashed var(--bark);border-radius:6px;padding:10px 14px;margin-top:12px;font-variant-numeric:tabular-nums}
.readout .big{font-size:clamp(20px,3.6vw,26px);color:var(--deep);line-height:1.4}
.readout .big b{color:var(--acc)}
.readout .sm{font-size:14px;color:var(--moss)}
.chip{display:inline-block;border-radius:20px;padding:1px 12px;font-size:14px;border:1.4px solid var(--ink);background:var(--card)}
.chip.good{background:var(--ok);color:#fff;border-color:var(--ok)}
.chip.bad{background:var(--bad);color:#fff;border-color:var(--bad)}
details.pts{margin-top:18px;padding:10px 18px}
details.pts summary{cursor:pointer;font-size:16px}
details.pts .kt{margin:12px 0 4px}
.ktt{font-size:15px;margin-bottom:4px;color:var(--deep)}
.ktw{overflow-x:auto}
.kt table{border-collapse:collapse;width:100%;font-size:15.5px;text-align:center}
.kt th{background:var(--acc);color:#fff;font-weight:400;padding:4px 10px;border:1.4px solid var(--ink);white-space:nowrap}
.kt td{padding:4px 10px;border:1.4px solid var(--ink);background:#fff;line-height:1.5}
.kt tbody tr:nth-child(even) td{background:#F6EEDF}
.kt td:first-child{font-weight:700;color:var(--deep)}

/* ---------- 題目 ---------- */
.pills{display:flex;gap:6px;margin:4px 0 12px;flex-wrap:wrap}
.pill{width:30px;height:30px;border-radius:50%;border:1.6px solid var(--ink);display:grid;place-items:center;font-size:14px;background:var(--card)}
.pill.on{background:var(--ink);color:var(--paper)}
.pill.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.qcard{border-top:1.6px dashed var(--bark);padding-top:14px}
.qtext{font-size:18px;line-height:1.65;margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;align-items:flex-start;padding:10px 14px;border:1.6px solid var(--ink);border-radius:6px;background:var(--card);min-height:48px;font-size:16.5px;line-height:1.5}
.opt:hover:not([disabled]){background:var(--sand)}
.opt:focus-visible{outline:3px solid var(--deep);outline-offset:2px}
.opt .ltr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-size:14px;margin-top:1px}
.opt.wrong{background:#EBD3CC;border-color:var(--bad);text-decoration:line-through;text-decoration-color:var(--bad);opacity:.8}
.opt.right{background:#D7E5D2;border-color:var(--ok)}
.opt[disabled]{cursor:default}
.fb{margin-top:14px;padding:10px 14px;border-radius:6px;font-size:16px;line-height:1.65}
.fb.hint{background:#F6E3C8;border:1.4px solid #B8863B}
.fb.good{background:#DDEAD8;border:1.4px solid var(--ok)}
.fb b{display:block;margin-bottom:2px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.sortrow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px dotted var(--clay)}
.sortrow.bad{background:#EBD3CC}
.sortrow.good{background:#DDEAD8}
.sortrow .segbtn{padding:4px 10px;min-height:36px}
.lock{padding:22px 16px;text-align:center;border:1.6px dashed var(--bark);border-radius:6px;background:#F3E9D8}
.lock b{font-size:20px}
.stamps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.stamp{border:1.6px dashed var(--bark);border-radius:6px;padding:6px 10px;font-size:14px;line-height:1.45;background:#F3E9D8;min-height:64px}
.stamp b{display:block;font-size:15px}
.stamp.got{border-style:solid;border-color:var(--acc);background:#fff;animation:pop .45s}
.stamp.got b{color:var(--acc)}
@keyframes pop{0%{transform:scale(.8)}60%{transform:scale(1.07)}100%{transform:scale(1)}}
.clear{text-align:center;padding:16px 8px}
.clear .seal{width:130px;height:130px;margin:0 auto 6px;animation:stampin .6s cubic-bezier(.2,1.3,.4,1)}
@keyframes stampin{0%{transform:scale(2.2) rotate(-18deg);opacity:0}100%{transform:scale(1) rotate(-6deg);opacity:1}}
.clear h3{font-size:26px}

/* ---------- 證書 ---------- */
.cert{position:relative;max-width:760px;margin:12px auto 0;background:#FFFCF4;border:2px solid var(--deep);padding:10px;box-shadow:6px 6px 0 var(--sand)}
.cert .in{border:5px double var(--bark);padding:28px 22px 26px;text-align:center;position:relative}
.cert h2{font-size:clamp(34px,7vw,54px);letter-spacing:.3em;color:var(--deep);margin-right:-.3em}
.cert .sub{color:var(--moss);margin:4px 0 18px}
.nameIn{width:min(420px,90%);text-align:center;font-size:clamp(26px,5vw,36px);background:transparent;border:0;border-bottom:2px solid var(--ink);padding:4px;color:var(--deep);border-radius:0}
.nameIn::placeholder{color:var(--clay);font-size:.6em}
.cert p.body{max-width:30em;margin:16px auto;font-size:17px}
.rank{display:inline-block;font-size:24px;border:2px solid var(--acc);color:var(--acc);padding:2px 22px;border-radius:6px;margin:6px 0;transform:rotate(-2deg)}
.seals{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:14px 0}
.seals svg{width:62px;height:62px}
.meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:15px;color:var(--moss);margin-top:14px;border-top:1.4px dashed var(--bark);padding-top:10px}
.shotTip{text-align:center;margin:18px 0 6px;font-size:17px}

.sr{position:absolute;left:-9999px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(max-width:520px){.panel{padding:12px 12px 18px}.qtext{font-size:17px}.tile{grid-template-columns:auto 1fr}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
'use strict';
/* =========================================================
   小工具
   ========================================================= */
const FONT='Huninn,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
const C={paper:'#F2E6D5',sand:'#D9C4B1',clay:'#B79C8E',bark:'#8F7B69',moss:'#5E5B4C',ink:'#3C3A3A',deep:'#2B2A29',card:'#FBF6EC',ok:'#4E7A4F',bad:'#A4473B',
  r1:'#B5523B',r2:'#2F7F86',r3:'#B8863B'};
const reduced=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
function h(tag,props,...kids){
  const e=document.createElement(tag);
  for(const k in (props||{})){const v=props[k];
    if(k==='class')e.className=v;
    else if(k==='html')e.innerHTML=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else if(v!==false&&v!=null)e.setAttribute(k,v===true?'':v);}
  kids.flat(9).forEach(k=>{if(k==null||k===false)return;e.append(k.nodeType?k:document.createTextNode(k));});
  return e;
}
const n2=(x,d=2)=>Number(Number(x).toFixed(d));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function txt(ctx,s,x,y,o={}){ctx.save();ctx.font=(o.w||400)+' '+(o.s||14)+'px '+FONT;ctx.fillStyle=o.c||C.ink;ctx.textAlign=o.a||'left';ctx.textBaseline=o.b||'alphabetic';ctx.fillText(s,x,y);ctx.restore();}
function ln(ctx,x1,y1,x2,y2,col,w,dash){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w||2;if(dash)ctx.setLineDash(dash);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();}
function head(ctx,x,y,ang,col,sz){sz=sz||9;ctx.save();ctx.fillStyle=col;ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(-sz,-sz*.5);ctx.lineTo(-sz,sz*.5);ctx.closePath();ctx.fill();ctx.restore();}
function rayArrow(ctx,x1,y1,x2,y2,col,w,dash){ln(ctx,x1,y1,x2,y2,col,w,dash);head(ctx,x2,y2,Math.atan2(y2-y1,x2-x1),col,9);}
function vArrow(ctx,x,y0,y1,col,w,dash){ // 垂直箭頭（物、像）
  ln(ctx,x,y0,x,y1,col,w||4,dash);const up=y1<y0;head(ctx,x,y1,up?-Math.PI/2:Math.PI/2,col,11);}
function arc(ctx,x,y,r,a0,a1,col,w){ctx.save();ctx.strokeStyle=col;ctx.lineWidth=w||2;ctx.beginPath();ctx.arc(x,y,r,a0,a1);ctx.stroke();ctx.restore();}

/* 會跟著寬度重畫的畫布 */
function mkCanvas(parent,hFn){
  const cv=document.createElement('canvas');parent.appendChild(cv);
  const o={cv,ctx:cv.getContext('2d'),W:300,H:200};
  let _d=function(){};
  Object.defineProperty(o,'draw',{get:()=>_d,set:f=>{_d=f;f();}});
  let lastW=0;
  o.resize=function(force){
    const w=Math.max(250,Math.floor(parent.clientWidth||300));
    if(w===lastW&&!force)return;lastW=w;
    const hh=Math.round(hFn(w)),d=window.devicePixelRatio||1;
    cv.width=w*d;cv.height=hh*d;cv.style.height=hh+'px';
    o.ctx.setTransform(d,0,0,d,0,0);o.W=w;o.H=hh;o.draw();
  };
  let ro=null;
  if(window.ResizeObserver){ro=new ResizeObserver(()=>o.resize());ro.observe(parent);}
  o.destroy=()=>{if(ro)ro.disconnect();};
  o.resize(true);
  return o;
}
function drawBg(o){o.ctx.clearRect(0,0,o.W,o.H);o.ctx.fillStyle=C.card;o.ctx.fillRect(0,0,o.W,o.H);}

let uid=0;
function slider(o){
  const id='sl'+(++uid);
  const out=h('output',{for:id,class:'sv'});
  const inp=h('input',{type:'range',id,min:o.min,max:o.max,step:o.step,value:o.val});
  const upd=()=>{const v=+inp.value;out.textContent=(o.fmt?o.fmt(v):v)+(o.unit||'');};
  inp.addEventListener('input',()=>{upd();o.onInput&&o.onInput(+inp.value);});
  upd();
  return {el:h('div',{class:'ctl'},h('label',{for:id},o.label),out,inp),get:()=>+inp.value,set:v=>{inp.value=v;upd();}};
}
function seg(options,val,onChange){
  const box=h('div',{class:'seg',role:'group'});const bs=[];
  options.forEach(([k,label])=>{const b=h('button',{type:'button',class:'segbtn','aria-selected':String(k===val),onclick:()=>{cur=k;bs.forEach((x,i)=>x.setAttribute('aria-selected',String(options[i][0]===k)));onChange(k);}},label);bs.push(b);box.append(b);});
  let cur=val;return {el:box,get:()=>cur};
}
function tabbed(root,items){
  const bar=h('div',{class:'seg',role:'tablist'}),body=h('div');root.append(bar,body);
  let d=null;const bs=[];
  function sel(i){if(d&&d.destroy)d.destroy();body.innerHTML='';d=items[i].build(body)||null;bs.forEach((b,j)=>b.setAttribute('aria-selected',String(i===j)));}
  items.forEach((it,i)=>{const b=h('button',{type:'button',role:'tab',class:'segbtn','aria-selected':'false',onclick:()=>sel(i)},it.label);bs.push(b);bar.append(b);});
  sel(0);
  return {destroy(){if(d&&d.destroy)d.destroy();}};
}
function loop(fn){let raf=0,on=true,last=performance.now();
  (function f(t){if(!on)return;const dt=Math.min(.05,(t-last)/1000);last=t;fn(dt);raf=requestAnimationFrame(f);})(last);
  return ()=>{on=false;cancelAnimationFrame(raf);};}

/* =========================================================
   共用繪圖
   ========================================================= */
function drawWaveSnap(ctx,W,H,lamPx,A,ph,col,bracket){
  const cy=H*.5;
  ln(ctx,0,cy,W,cy,C.sand,1.5,[5,5]);
  ctx.save();ctx.beginPath();ctx.lineWidth=3.5;ctx.strokeStyle=col;ctx.lineJoin='round';
  for(let x=0;x<=W;x+=2){const y=cy-A*Math.sin(2*Math.PI*x/lamPx-ph);x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
  ctx.stroke();ctx.restore();
  if(bracket){
    const P=2*Math.PI;let x0=(((Math.PI/2+ph)%P)+P)%P*lamPx/P;
    while(x0<14)x0+=lamPx;
    if(x0+lamPx<W-8){
      const y=cy-A-14;
      ln(ctx,x0,y,x0+lamPx,y,C.deep,2);ln(ctx,x0,y-5,x0,y+5,C.deep,2);ln(ctx,x0+lamPx,y-5,x0+lamPx,y+5,C.deep,2);
      txt(ctx,'λ',x0+lamPx/2,y-6,{a:'center',s:17,w:700,c:C.deep});
      ln(ctx,x0,cy-A,x0,y,C.clay,1,[3,3]);ln(ctx,x0+lamPx,cy-A,x0+lamPx,y,C.clay,1,[3,3]);
    }
  }
}
function drawPinhole(ctx,W,H,u,s){
  const cy=H*.5,px=W*.42,unit=W*.40/10,oh=H*.14,xo=px-u*unit,xs=px+s*unit;
  ctx.fillStyle=C.card;ctx.fillRect(0,0,W,H);
  ln(ctx,0,cy,W,cy,C.sand,1.3,[4,5]);
  // 隔板
  ln(ctx,px,4,px,cy-4,C.ink,5);ln(ctx,px,cy+4,px,H-4,C.ink,5);
  txt(ctx,'小孔',px,H-8,{a:'center',s:13,c:C.moss});
  // 紙屏
  ctx.fillStyle='#fff';ctx.fillRect(xs-3,6,6,H-12);ctx.strokeStyle=C.bark;ctx.lineWidth=1.5;ctx.strokeRect(xs-3,6,6,H-12);
  txt(ctx,'紙屏',xs,H-8,{a:'center',s:13,c:C.moss});
  // 光線
  const ih=oh*s/u,tipY=Math.min(H-8,cy+ih);
  ln(ctx,xo,cy-oh,px,cy,C.r3,2.2);ln(ctx,px,cy,xs,cy+ih,C.r3,2.2);
  // 物與像
  vArrow(ctx,xo,cy,cy-oh,C.ink,4);
  ctx.beginPath();ctx.fillStyle='#E3A33B';ctx.arc(xo,cy-oh-6,5,0,7);ctx.fill();
  txt(ctx,'蠟燭',xo,H-8,{a:'center',s:13,c:C.moss});

function drawReflect(ctx,W,H,th){

function drawPlane(ctx,W,H,d){

  txt(ctx,'物',ox,gy+16,{a:'center',s:13,c:C.moss});txt(ctx,'像（虛像）',imx,gy+16,{a:'center',s:13,c:C.r1});

  const y2=y1-22;ln(ctx,ox,y2,imx,y2,C.deep,2);ln(ctx,ox,y2-5,ox,y2+5,C.deep,2);ln(ctx,imx,y2-5,imx,y2+5,C.deep,2);

const MEDIA={air:{n:'空氣',n1:1.0,bg:'#F6EFE0',sp:3.00},water:{n:'水',n1:1.33,bg:'#CFE1E6',sp:2.26},glass:{n:'玻璃',n1:1.5,bg:'#D9E5D4',sp:2.00}};
function refractCalc(a,b,th){const s=MEDIA[a].n1*Math.sin(th*Math.PI/180)/MEDIA[b].n1;return s>1?null:Math.asin(s)*180/Math.PI;}
function drawRefract(ctx,W,H,a,b,th){
  const cx=W/2,cy=H/2,R=H*.40,t=th*Math.PI/180,t2=refractCalc(a,b,th);
  ctx.fillStyle=MEDIA[a].bg;ctx.fillRect(0,0,W,cy);ctx.fillStyle=MEDIA[b].bg;ctx.fillRect(0,cy,W,H-cy);
  ln(ctx,0,cy,W,cy,C.deep,2.5);
  ln(ctx,cx,6,cx,H-6,C.moss,1.6,[6,5]);txt(ctx,'法線',cx+6,18,{s:13,c:C.moss});
  txt(ctx,MEDIA[a].n+'（光速 '+MEDIA[a].sp.toFixed(2)+'）',10,22,{s:14,c:C.deep});
  txt(ctx,MEDIA[b].n+'（光速 '+MEDIA[b].sp.toFixed(2)+'）',10,H-12,{s:14,c:C.deep});
  const ix=cx-R*Math.sin(t),iy=cy-R*Math.cos(t);
  rayArrow(ctx,ix,iy,cx,cy,C.r2,3);
  ln(ctx,cx,cy,cx+R*Math.sin(t)*.9,cy-R*Math.cos(t)*.9,'rgba(60,58,58,.25)',1.5,[4,4]);
  if(t2==null){rayArrow(ctx,cx,cy,cx+R*Math.sin(t),cy-R*Math.cos(t),C.r1,3);
    txt(ctx,'光出不去，全部反射回來（全反射，不用考）',cx,H-30,{a:'center',s:14,c:C.bad,w:700});}
  else{const r2=t2*Math.PI/180;rayArrow(ctx,cx,cy,cx+R*Math.sin(r2),cy+R*Math.cos(r2),C.r1,3);
    arc(ctx,cx,cy,R*.3,-Math.PI/2-t,-Math.PI/2,C.r2,2.5);arc(ctx,cx,cy,R*.34,Math.PI/2-r2,Math.PI/2,C.r1,2.5);
    if(th>4){txt(ctx,'入射角 '+th+'°',cx-R*.34-6,cy-R*.36,{a:'right',s:14,c:C.r2,w:700});
      txt(ctx,'折射角 '+n2(t2,1)+'°',cx+R*.34+6,cy+R*.5,{s:14,c:C.r1,w:700});}}
}
function lensCalc(type,u){
  const F=type==='convex'?10:-10;
  if(type==='convex'&&Math.abs(u-10)<1e-9)return {exists:false};
  const v=u*F/(u-F),m=-v/u;
  return {exists:true,v,m,real:v>0,upright:m>0,size:Math.abs(m)>1.0001?'放大':Math.abs(m)<.9999?'縮小':'等大'};
}
function zoneOf(u){return u>20?0:u===20?1:u>10?2:u===10?3:4;}
const ZONES=[
  {k:'u > 2F',t:'在 2F 以外',p:'倒立・縮小・實像'},
  {k:'u = 2F',t:'剛好在 2F',p:'倒立・等大・實像'},
  {k:'F < u < 2F',t:'F 與 2F 之間',p:'倒立・放大・實像'},
  {k:'u = F',t:'剛好在 F',p:'不成像（光線平行射出）'},
  {k:'u < F',t:'在 F 以內',p:'正立・放大・虛像'}];

/* ---------- 透鏡實驗台（實驗室與闖關題共用） ---------- */
function LensLab(root,opt){
  const st={type:opt.type||'convex',u:opt.u||30,cover:false};
  const wrap=h('div',{class:'cvwrap'});root.append(wrap);
  const cb=mkCanvas(wrap,w=>Math.round(Math.min(360,Math.max(240,w*.55))));
  const info=h('div',{class:'readout'});
  let sl=null;
  const api={getU:()=>st.u,getType:()=>st.type};
  cb.draw=function(){
    const {ctx,W,H}=cb;drawBg(cb);
    const lx=W*.5,ay=H*.52,xs=(lx-12)/36,oh=H*.16,LH=H*.43,F=st.type==='convex'?10:-10;
    ln(ctx,0,ay,W,ay,C.bark,1.4);
    [-2,-1,1,2].forEach(k=>{const x=lx+k*10*xs;ln(ctx,x,ay-5,x,ay+5,C.deep,2);txt(ctx,Math.abs(k)===1?'F':'2F',x,ay+20,{a:'center',s:13,c:C.moss});});
    const u=st.u,c=lensCalc(st.type,u),ox=lx-u*xs,tipY=ay-oh;
    // 透鏡
    ctx.save();ctx.beginPath();
    if(st.type==='convex'){ctx.moveTo(lx,ay-LH);ctx.quadraticCurveTo(lx+16,ay,lx,ay+LH);ctx.quadraticCurveTo(lx-16,ay,lx,ay-LH);}
    else{ctx.moveTo(lx-9,ay-LH);ctx.lineTo(lx+9,ay-LH);ctx.quadraticCurveTo(lx-3,ay,lx+9,ay+LH);ctx.lineTo(lx-9,ay+LH);ctx.quadraticCurveTo(lx+3,ay,lx-9,ay-LH);}
    ctx.fillStyle='rgba(47,127,134,.2)';ctx.fill();ctx.strokeStyle=C.ink;ctx.lineWidth=2;ctx.stroke();ctx.restore();
    // 螢幕（實像）
    const Ix=c.exists?lx+c.v*xs:0,Ih=c.exists?c.m*oh:0;
    if(c.exists&&c.real&&Ix<W-4){ctx.fillStyle='#fff';ctx.fillRect(Ix-2,ay-LH*.85,4,LH*1.7);ctx.strokeStyle=C.bark;ctx.lineWidth=1.2;ctx.strokeRect(Ix-2,ay-LH*.85,4,LH*1.7);}
    // 光線
    const rays=[{hit:oh,col:C.r1},{hit:0,col:C.r2}];
    if(!(st.type==='convex'&&u===10))rays.push({hit:oh*F/(F-u),col:C.r3});
    ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();
    rays.forEach(r=>{
      if(Math.abs(r.hit)>LH)return;
      const py=ay-r.hit,blocked=st.cover&&r.hit>.5;
      ln(ctx,ox,tipY,lx,py,r.col,2);
      if(blocked){txt(ctx,'✕',lx-4,py+4,{s:14,c:C.deep,w:700,a:'center'});return;}
      let dx,dy;
      if(!c.exists){dx=lx-ox;dy=ay-tipY;}
      else if(c.real){dx=Ix-lx;dy=(ay-Ih)-py;}
      else{dx=lx-Ix;dy=py-(ay-Ih);}
      const len=Math.hypot(dx,dy);dx/=len;dy/=len;
      const tt=(W-lx)/dx;
      ln(ctx,lx,py,lx+dx*tt,py+dy*tt,r.col,2);
      if(c.exists&&!c.real)ln(ctx,lx,py,Ix,ay-Ih,r.col,1.6,[5,5]);
    });
    ctx.restore();
    if(st.cover){ctx.fillStyle='rgba(43,42,41,.88)';ctx.fillRect(lx-7,ay-LH-2,14,LH+2);}
    // 物
    vArrow(ctx,ox,ay,tipY,C.ink,4);ctx.beginPath();ctx.fillStyle='#E3A33B';ctx.arc(ox,tipY-6,5,0,7);ctx.fill();
    txt(ctx,'物',ox,ay+36,{a:'center',s:13,c:C.moss});
    // 像
    if(c.exists){
      ctx.save();ctx.beginPath();ctx.rect(0,0,W,H);ctx.clip();ctx.globalAlpha=st.cover?.45:1;
      const col='#84487A';
      vArrow(ctx,Ix,ay,ay-Ih,col,4.5,c.real?null:[6,5]);ctx.restore();
      if(Ix>W-8)txt(ctx,'像在更遠的右邊 →',W-8,H-8,{a:'right',s:13,c:'#84487A'});
      if(Ix<8)txt(ctx,'← 虛像在更遠的左邊',8,H-8,{s:13,c:'#84487A'});
      if(Ix>=8&&Ix<=W-8){const left=Ix+45>W;txt(ctx,c.real?'實像':'虛像',left?Ix-9:Ix+9,Ih<0?ay-8:ay+36,{a:left?'right':'left',s:13,c:'#84487A'});}
    }else txt(ctx,'光線平行射出，找不到交會點，沒有像',W/2,H-10,{a:'center',s:14,c:C.bad,w:700});
  };
  function readout(){
    const c=lensCalc(st.type,st.u);
    if(opt.readout==='none'){info.remove();return;}
    if(opt.readout==='mag'){
      info.innerHTML=c.exists?`<div class="big">像是物的 <b>${n2(Math.abs(c.m),1)}</b> 倍大</div>`:`<div class="big"><b>沒有像</b></div>`;return;}
    const zone=st.type==='convex'?ZONES[zoneOf(st.u)].t:'';
    let desc;
    if(!c.exists)desc='<b>不成像</b>（光線平行射出）';
    else desc=`<b>${c.upright?'正立':'倒立'}・${c.size}・${c.real?'實像':'虛像'}</b>`;
    info.innerHTML=`<div class="big">物距 u = <b>${st.u}</b> cm${zone?'（'+zone+'）':''}</div><div class="big">像：${desc}</div>`;
  }
  const ctlbox=h('div',{class:'ctls'});
  function update(){cb.draw();readout();opt.onChange&&opt.onChange(st);}
  sl=slider({label:'蠟燭離透鏡的距離（物距 u）',min:opt.umin||3,max:opt.umax||35,step:.5,val:st.u,unit:' cm',onInput:v=>{st.u=v;update();}});
  ctlbox.append(sl.el);
  if(opt.typeSwitch){
    const sg=seg([['convex','凸透鏡'],['concave','凹透鏡']],st.type,k=>{st.type=k;update();});
    ctlbox.prepend(sg.el);
  }
  if(opt.coverBtn){
    const b=h('button',{type:'button',class:'segbtn','aria-pressed':'false',onclick:()=>{st.cover=!st.cover;b.setAttribute('aria-pressed',String(st.cover));b.textContent=st.cover?'拿開黑紙':'用黑紙遮住上半部透鏡';update();}},'用黑紙遮住上半部透鏡');
    ctlbox.append(b);
  }
  root.append(ctlbox);
  if(opt.readout!=='none')root.append(info);
  readout();
  api.destroy=()=>cb.destroy();
  api.state=st;
  return api;
}

function labWave(root){
  let f=1,A=30,t=0,playing=!reduced;
  const wrap=h('div',{class:'cvwrap'});root.append(wrap);
  const cb=mkCanvas(wrap,w=>Math.round(Math.max(200,w*.46)));
  const R=h('div',{class:'readout'});
  cb.draw=function(){
    const {ctx,W,H}=cb;drawBg(cb);
    const cy=H*.52,vpx=W*.26,lam=vpx/f,k=2*Math.PI/lam,w=2*Math.PI*f,amp=A/60*H*.36;
    ln(ctx,0,cy,W,cy,C.sand,1.5,[5,5]);
    ctx.save();ctx.beginPath();ctx.lineWidth=3.5;ctx.strokeStyle=C.r2;ctx.lineJoin='round';
    for(let x=0;x<=W;x+=2){const y=cy-amp*Math.sin(k*x-w*t);x?ctx.lineTo(x,y):ctx.moveTo(x,y);}
    ctx.stroke();ctx.restore();
    const lx=W*.62,ly=cy-amp*Math.sin(k*lx-w*t);
    ln(ctx,lx,8,lx,H-8,C.clay,1.4,[4,4]);
    ctx.beginPath();ctx.fillStyle=C.r1;ctx.strokeStyle=C.deep;ctx.lineWidth=2;ctx.arc(lx,ly,9,0,7);ctx.fill();ctx.stroke();
    txt(ctx,'葉子',lx+14,ly-10,{s:14,c:C.r1,w:700});
    txt(ctx,'波往右傳 →',W-10,18,{a:'right',s:14,c:C.moss});
  };
  function read(){R.innerHTML=`<div class="big">頻率 f = <b>${f}</b> Hz　週期 T = 1 ÷ ${f} = <b>${n2(1/f,3)}</b> 秒</div><div class="sm">f：每秒振動幾次　T：振動一次要幾秒</div>`;}
  const s1=slider({label:'頻率 f（手每秒甩幾次）',min:.5,max:4,step:.5,val:f,unit:' Hz',onInput:v=>{f=v;read();cb.draw();}});
  const s2=slider({label:'振幅（甩得多用力）',min:10,max:60,step:5,val:A,onInput:v=>{A=v;cb.draw();}});
  const pb=h('button',{type:'button',class:'segbtn',onclick:()=>{playing=!playing;pb.textContent=playing?'暫停':'播放';}},playing?'暫停':'播放');

  return {destroy(){stop();cb.destroy();}};
}

      const sg=seg([['sine','圓滑波形'],['square','方形波形'],['tri','三角波形']],wv,k=>{wv=k;if(osc)try{osc.type=k==='tri'?'triangle':k;}catch(e){}upd();});

const KEY='physics-quest-v1';

function res(i){const id=STAGES[i].id;if(!prog[id])prog[id]=[];return prog[id];}
function stageDone(i){const r=res(i);return STAGES[i].qs.every((q,k)=>r[k]);}
function stageStars(i){return res(i).filter(x=>x&&x.first).length;}
function unlocked(i){return true;}
const totalQ=STAGES.reduce((a,s)=>a+s.qs.length,0);
const totalStars=()=>STAGES.reduce((a,s,i)=>a+stageStars(i),0);
const allDone=()=>STAGES.every((s,i)=>stageDone(i));

const app=document.getElementById('app');
let cleanup=[];

function go(fn){leave();app.innerHTML='';window.scrollTo(0,0);fn();}

    [['#B79C8E',34,.9,0],['#8F7B69',22,1.5,1.2],['#5E5B4C',12,2.4,2.4]].forEach(([c,a,k,o])=>{ctx.beginPath();ctx.strokeStyle=c;ctx.lineWidth=2.6;
      for(let x=0;x<=W;x+=3){const y=42+a*.5*Math.sin(x/(60/k)-ph*k+o);x?ctx.lineTo(x,y):ctx.moveTo(x,y);}ctx.stroke();});};

  const gate={n:0,total:S.gate||0,listeners:[]};
  const ctx={setGate(n,t){gate.n=n;gate.total=t;gate.listeners.forEach(f=>f());}};
  const lab=h('section',{class:'panel label'},h('div',{class:'ptag'},'實驗室'),h('div',{class:'mission'},S.mission),labRoot);
  const quiz=h('section',{class:'panel label'},h('div',{class:'ptag'},'闖關題'),quizRoot);
  const pts=h('details',{class:'pts label'},h('summary',null,'卡住了？打開重點小卡'),S.tables.map(tb=>h('div',{class:'kt'},h('div',{class:'ktt'},tb.t),h('div',{class:'ktw'},h('table',null,h('thead',null,h('tr',null,tb.h.map(c=>h('th',null,c)))),h('tbody',null,tb.r.map(r=>h('tr',null,r.map(c=>h('td',null,c))))))))));
  const grid=h('div',{class:'stageGrid'},lab,quiz);
  const wrapper=h('div',{style:'--acc:'+S.acc},top,grid,pts);
  app.append(wrapper);
  const L=S.lab(labRoot,ctx);
  cleanup.push(()=>L&&L.destroy&&L.destroy());
  Quiz(quizRoot,i,gate);
}

/* ---------- 題目引擎 ---------- */
function Quiz(root,si,gate){
  const S=STAGES[si],r=res(si),n=S.qs.length;
  let cur=0;while(cur<n&&r[cur])cur++;
  let qCleanup=null;
  function clearQ(){if(qCleanup){try{qCleanup();}catch(e){}qCleanup=null;}}
  cleanup.push(clearQ);
  function render(){
    clearQ();root.innerHTML='';
    if(gate.total&&gate.n<gate.total){
      root.append(h('div',{class:'lock'},h('b',null,'先集章再闖關'),h('p',null,`在左邊的實驗室集滿 ${gate.total} 個印章（現在 ${gate.n} / ${gate.total}）。`)));
      return;
    }
    const pills=h('div',{class:'pills'},S.qs.map((q,k)=>h('span',{class:'pill'+(r[k]?' ok':k===cur?' on':'')},r[k]?'✓':String(k+1))));
    root.append(pills);
    if(cur>=n){clearBanner();return;}
    question(cur);
  }
  gate.listeners.push(()=>{if(root.querySelector('.lock')||gate.n>=gate.total)render();});
  function clearBanner(){
    const sc=stageStars(si);
    const nextOk=si<STAGES.length-1;
    const act=h('div',{class:'actions',style:'justify-content:center'},
      h('button',{type:'button',class:'btn',onclick:()=>go(Home)},'回到地圖'),
      si<STAGES.length-1?h('button',{type:'button',class:'btn acc',onclick:()=>go(()=>Stage(si+1))},'前往第 '+(si+2)+' 關'):
        h('button',{type:'button',class:'btn acc',onclick:()=>go(Cert)},'領取通關證書'));
    root.append(h('div',{class:'clear'},h('div',{class:'seal',html:seal(S.acc,String(si+1),130)}),h('h3',null,'第 '+(si+1)+' 關通過'),
      h('p',null,h('span',{class:'stars',style:'font-size:22px'},'★'.repeat(sc)+'☆'.repeat(n-sc))),
      h('p',{style:'color:#5E5B4C;margin:4px 0 10px'},sc===n?'全部一次答對，太強了。':'星星是一次就答對的題數，可以再回來挑戰。'),act));
  }
  function question(k){
    const q=S.qs[k];let attempts=0,solved=false;
    const card=h('div',{class:'qcard'});
    const fb=h('div',{'aria-live':'polite'});
    const nextBtn=h('button',{type:'button',class:'btn acc',onclick:()=>{cur=k+1;render();}},k===n-1?'完成本關':'下一題');
    function done(){
      solved=true;r[k]={first:attempts===0};save();
      fb.innerHTML='';fb.append(h('div',{class:'fb good'},h('b',null,attempts===0?'答對了！':'答對了，再多想一次就更穩了'),q.why));
      card.append(h('div',{class:'actions'},nextBtn));nextBtn.focus({preventScroll:true});
      const pl=root.querySelectorAll('.pill')[k];if(pl){pl.className='pill ok';pl.textContent='✓';}
    }
    function wrong(){attempts++;card.classList.remove('shake');void card.offsetWidth;card.classList.add('shake');
      fb.innerHTML='';fb.append(h('div',{class:'fb hint'},h('b',null,'再想想'),q.hint));}
    card.append(h('p',{class:'qtext'},q.q));
    if(q.t==='choice'){
      const box=h('div',{class:'opts'});const order=shuffle(q.opts.map((o,idx)=>idx));
      order.forEach((idx,pos)=>{
        const b=h('button',{type:'button',class:'opt',onclick:()=>{
          if(solved)return;
          if(idx===q.ans){b.classList.add('right');box.querySelectorAll('.opt').forEach(x=>x.disabled=true);done();}
          else{b.classList.add('wrong');b.disabled=true;wrong();}}},
          h('span',{class:'ltr'},'ABCD'[pos]),h('span',null,q.opts[idx]));
        box.append(b);});
      card.append(box);
    }else if(q.t==='slider'){
      const vals={};const sls={};
      const ctl=h('div',{class:'ctls'});
      q.controls.forEach(c=>{vals[c.id]=c.val;sls[c.id]=slider({label:c.label,min:c.min,max:c.max,step:c.step,val:c.val,unit:c.unit,onInput:v=>{vals[c.id]=v;upd();}});ctl.append(sls[c.id].el);});
      const ro=h('div',{class:'readout'});
      let cb=null;
      if(q.viz){const w=h('div',{class:'cvwrap'});card.append(w);cb=mkCanvas(w,ww=>Math.round(Math.max(170,ww*.4)));cb.draw=()=>{drawBg(cb);q.viz(cb.ctx,cb.W,cb.H,vals);};cb.draw();qCleanup=()=>cb.destroy();}
      function upd(){ro.innerHTML='<div class="big">'+q.readout(vals)+'</div>';if(cb)cb.draw();}
      upd();
      const ok=h('button',{type:'button',class:'btn',onclick:()=>{if(solved)return;if(q.check(vals)){ok.disabled=true;Object.values(sls).forEach(s=>s.el.querySelector('input').disabled=true);done();}else wrong();}},'確認答案');
      card.append(ctl,ro,h('div',{class:'actions'},ok));
    }else if(q.t==='sort'){
      const pick={};const rows=[];
      q.items.forEach(([name,ans],ii)=>{
        const row=h('div',{class:'sortrow'},h('span',null,name));
        q.buckets.forEach(([key,label])=>{const b=h('button',{type:'button',class:'segbtn','aria-selected':'false',onclick:()=>{if(solved)return;pick[ii]=key;row.querySelectorAll('.segbtn').forEach(x=>x.setAttribute('aria-selected',String(x===b)));row.classList.remove('bad');}},label);row.append(b);});
        rows.push(row);card.append(row);});
      const ok=h('button',{type:'button',class:'btn',onclick:()=>{if(solved)return;
        if(Object.keys(pick).length<q.items.length){fb.innerHTML='';fb.append(h('div',{class:'fb hint'},h('b',null,'還沒選完'),'每一個都要選凹面鏡或凸面鏡。'));return;}
        let bad=0;q.items.forEach(([,ans],ii)=>{const okk=pick[ii]===ans;rows[ii].classList.toggle('bad',!okk);if(!okk)bad++;});
        if(bad===0){rows.forEach(rw=>rw.classList.add('good'));ok.disabled=true;done();}else{wrong();fb.firstChild.append(h('div',null,'紅色的列選錯了，改一改再確認。'));}
      }},'確認答案');
      card.append(h('div',{class:'actions'},ok));
    }else if(q.t==='lens'){
      const lab=LensLab(card,{type:'convex',u:q.u,umin:q.range[0],umax:q.range[1],readout:q.readout||'none'});
      qCleanup=()=>lab.destroy();
      const ok=h('button',{type:'button',class:'btn',onclick:()=>{if(solved)return;if(q.check(lab.getU())){ok.disabled=true;card.querySelector('input').disabled=true;done();}else wrong();}},'確認這個位置');
      card.append(h('div',{class:'actions'},ok));
    }
    card.append(fb);root.append(card);
  }
  render();
}

/* ---------- 證書 ---------- */
function Cert(){
  const ts=totalStars(),acc=ts/totalQ;
  const rank=acc>=.9?'光聲大師':acc>=.7?'實驗達人':'闖關勇者';
  const d=new Date();const date=`${d.getFullYear()} / ${d.getMonth()+1} / ${d.getDate()}`;
  const nameIn=h('input',{class:'nameIn',type:'text',id:'nm',placeholder:'點這裡輸入你的名字',maxlength:'12','aria-label':'你的名字',autocomplete:'off'});
  const seals=h('div',{class:'seals'},STAGES.map((s,i)=>h('span',{html:seal(s.acc,String(i+1),62),title:s.title})));
  const cert=h('div',{class:'cert label'},h('div',{class:'in'},
    h('h2',null,'通關證書'),h('p',{class:'sub'},'國二理化・第二次段考　光與聲闖關基地'),
    nameIn,
    h('p',{class:'body'},'完成波動、聲音、光的直進、反射、折射與透鏡成像共七個關卡，用自己的觀察找到了答案。'),
    h('div',{class:'rank'},rank),
    seals,
    h('div',{class:'meta'},h('span',null,'一次答對 '+ts+' / '+totalQ+' 題'),h('span',null,date))));
  app.append(h('div',{class:'top'},h('button',{type:'button',class:'ghost',onclick:()=>go(Home)},'回到地圖')),
    h('div',{class:'shotTip'},'輸入名字後，請截圖這個畫面傳給老師。'),cert,
    h('div',{class:'actions',style:'justify-content:center;margin-top:22px'},
      (function(){let armed=false;const b=h('button',{type:'button',class:'ghost',onclick:()=>{if(!armed){armed=true;b.textContent='再按一次，確定清除所有紀錄';return;}prog={};save();go(Home);}},'清除紀錄，重新闖關');return b;})()));
}

go(Home);
</script>
